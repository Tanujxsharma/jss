server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - PATCH
              - OPTIONS
              - HEAD
            allowedHeaders: "*"
            allowCredentials: true
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE
      routes:
        # ==========================================
        # 1. Auth Service Routes
        # ==========================================
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/api/auth/**

        - id: auth-service-docs
          uri: lb://auth-service
          predicates:
            - Path=/auth-service/v3/api-docs/**, /auth-service/swagger-ui/**, /auth-service/swagger-ui.html
          filters:
            - StripPrefix=1

        # ==========================================
        # 2. Employer Service Routes
        # ==========================================
        - id: employer-service
          uri: lb://employer-service
          predicates:
            - Path=/api/employers/**

        - id: employer-service-docs
          uri: lb://employer-service
          predicates:
            - Path=/employer-service/v3/api-docs/**, /employer-service/swagger-ui/**, /employer-service/swagger-ui.html
          filters:
            - StripPrefix=1

        # ==========================================
        # 3. Job Service Routes
        # ==========================================
        - id: job-service
          uri: lb://job-service
          predicates:
            - Path=/api/jobs/**

        - id: job-service-docs
          uri: lb://job-service
          predicates:
            - Path=/job-service/v3/api-docs/**, /job-service/swagger-ui/**, /job-service/swagger-ui.html
          filters:
            - StripPrefix=1

        # ==========================================
        # 4. Jobseeker Service Routes
        # ==========================================
        - id: jobseeker-service
          uri: lb://jobseeker-service
          predicates:
            - Path=/api/jobseekers/**

        - id: jobseeker-service-docs
          uri: lb://jobseeker-service
          predicates:
            - Path=/jobseeker-service/v3/api-docs/**, /jobseeker-service/swagger-ui/**, /jobseeker-service/swagger-ui.html
          filters:
            - StripPrefix=1

        # ==========================================
        # 5. Application Service Routes
        # ==========================================
        - id: application-service
          uri: lb://application-service
          predicates:
            - Path=/api/applications/**

        - id: application-service-docs
          uri: lb://application-service
          predicates:
            - Path=/application-service/v3/api-docs/**, /application-service/swagger-ui/**, /application-service/swagger-ui.html
          filters:
            - StripPrefix=1

        # ==========================================
        # 6. Basket Service Routes
        # ==========================================
        - id: basket-service
          uri: lb://basket-service
          predicates:
            - Path=/api/basket/**

        - id: basket-service-docs
          uri: lb://basket-service
          predicates:
            - Path=/basket-service/v3/api-docs/**, /basket-service/swagger-ui/**, /basket-service/swagger-ui.html
          filters:
            - StripPrefix=1

        # ==========================================
        # 7. Messaging Service Routes
        # ==========================================
        - id: messaging-service
          uri: lb://messaging-service
          predicates:
            - Path=/api/messages/**

        - id: messaging-service-docs
          uri: lb://messaging-service
          predicates:
            - Path=/messaging-service/v3/api-docs/**, /messaging-service/swagger-ui/**, /messaging-service/swagger-ui.html
          filters:
            - StripPrefix=1

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

logging:
  level:
    org.springframework.cloud.gateway: INFO
    com.jobsearch.apigateway: DEBUG
